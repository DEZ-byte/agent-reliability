{
  "schema_version": 1,
  "_comment": [
    "Frozen training configuration. BLUEPRINT_v2 section 7.4 requires these",
    "pinned before any training run. JSON syntax, a YAML 1.2 subset, for the",
    "same reason as configs/eval.yaml and configs/gates.yaml (D-021): a strict",
    "standard-library loader and no extra dependency.",
    "",
    "This file's SHA-256 is written into every training artifact and its first",
    "eight hex characters are the <confighash> in every checkpoint name, so a",
    "value changed after a run invalidates the name that run was published",
    "under. Add a dated decision rather than editing a value in place.",
    "",
    "Two kinds of value live here and they are kept apart on purpose.",
    "Pre-registered values come from the blueprint and were fixed before any",
    "measurement. Measured values are null until the measurement that sets them",
    "exists, and every script refuses to run while a required one is null. That",
    "is what stops a threshold being chosen after seeing which value flatters a",
    "result."
  ],

  "sft": {
    "epochs": 2,
    "learning_rate": 0.0002,
    "lr_scheduler_type": "cosine",
    "warmup_ratio": 0.03,
    "per_device_train_batch_size": 2,
    "gradient_accumulation_steps": 8,
    "max_seq_length": 1024,
    "seed": 20260820,
    "data_seed": 3407,
    "save_steps": 25,
    "load_in_4bit": true,
    "lora": {
      "r": 16,
      "alpha": 32,
      "dropout": 0.0,
      "target_modules": [
        "q_proj", "k_proj", "v_proj", "o_proj",
        "gate_proj", "up_proj", "down_proj"
      ]
    },
    "_comment": [
      "Pre-registered. Section 7.4 fixes LoRA r=16, alpha=32 and 4-bit, and",
      "gives SFT 2-3 epochs; 2 is the low end because the retained set is on",
      "the order of a thousand short rows and more passes over it buy",
      "memorisation rather than capability. Checkpoint selection on dev covers",
      "the difference either way.",
      "Effective batch is 2 x 8 = 16. At roughly a thousand rows that is about",
      "60 steps an epoch, so save_steps 25 produces a handful of checkpoints:",
      "few enough that every one of them can be evaluated on dev rather than",
      "some of them being ranked by a cheaper signal.",
      "max_seq_length 1024 against a measured 293-token training row leaves",
      "room for a longer question without truncating a trained span. Truncation",
      "here is silent: the row still has labels and still trains.",
      "data_seed 3407 was discovered, not chosen. Unsloth sets it on SFTConfig",
      "regardless of the seed passed, so the first run's row order came from a",
      "default nobody recorded. It is pinned here to the value that actually",
      "ran, because a config that omits it does not determine the run."
    ]
  },

  "generation": {
    "rung": "R0",
    "runs_per_task": 4,
    "temperature": 0.7,
    "top_p": 0.95,
    "max_new_tokens": 256,
    "enable_thinking": false,
    "seed_base": 20260821,
    "_comment": [
      "Teacher rollouts over the frozen train split. Values match eval.yaml but",
      "this is a generation config, not an evaluation config, and carries its",
      "own hash: a run that borrowed eval.yaml's hash would claim comparability",
      "it does not have.",
      "seed_base differs from eval.yaml's so a generation seed and an evaluation",
      "seed can never silently coincide.",
      "Rung R0 only. R1 would add a second decision, but the Phase A loop ends",
      "an episode as soon as a calculator call succeeds, so the dominant failure",
      "- a well-formed call that computes the wrong thing - never reaches a",
      "second decision. See D-069."
    ]
  },

  "grpo": {
    "init_from": "sft",
    "num_generations": 8,
    "beta": 0.0,
    "epsilon": 0.2,
    "loss_type": "grpo",
    "importance_sampling_level": "token",
    "scale_rewards": "group",
    "temperature": 0.8,
    "top_p": 0.95,
    "max_prompt_length": 512,
    "max_completion_length": 256,
    "learning_rate": 0.000001,
    "per_device_train_batch_size": 8,
    "gradient_accumulation_steps": 2,
    "max_steps": 400,
    "save_steps": 100,
    "seed": 20260825,
    "_comment": [
      "Section 7.1: GRPO initialises from the SFT checkpoint, never from base.",
      "GRPO-from-base would be a separate labelled ablation and is not run here.",
      "",
      "beta is 0.0, which removes the KL term, and that is a correctness choice",
      "rather than a tuning one. Section 7.1 warns that disabling an SFT LoRA to",
      "compute reference log-probabilities exposes the BASE model rather than the",
      "SFT policy, which is what PEFT does by default. A non-zero beta would",
      "therefore pull the policy toward base rather than toward the frozen SFT",
      "policy the section requires, silently training the opposite of what is",
      "written down. Section 7.2 permits beta in 0 to 0.04, so zero is inside the",
      "pre-registered band and is the only value that avoids the ambiguity.",
      "",
      "loss_type grpo and importance_sampling_level token: section 7.2 specifies",
      "the token-level formulation explicitly and calls the sequence-level one",
      "numerically vacuous. The installed default is dapo, so this is pinned",
      "rather than inherited.",
      "",
      "temperature 0.8 sits in section 7.3's 0.7 to 0.85 band. The installed",
      "default is 1.0. Rollouts that collapse to identical strings give a",
      "zero-variance group, which contributes exactly no gradient because the",
      "advantage is group-relative.",
      "",
      "G=8 is the low end of section 7.1's 8 to 16, chosen for an 8 GB card.",
      "Every candidate costs a real sandbox execution, measured at 0.074s, so a",
      "step at this batch costs about 2.4s of grading on top of generation.",
      "",
      "learning_rate 1e-6 is two orders below the SFT rate. Policy-gradient",
      "updates act on a model that already works; the failure mode is collapse,",
      "not slow convergence.",
      "",
      "max_steps 400 at 2 prompts per optimizer step is 800 prompt visits over a",
      "1000-task split, so under one epoch. It was raised from 120 after a smoke",
      "run measured what section 7.3 predicts: the SFT policy already solves many",
      "prompts on every one of the 8 candidates, giving a zero-variance group and",
      "exactly no gradient. Half to all groups were dead in the smoke, so roughly",
      "half the steps teach nothing and the budget has to absorb that.",
      "A null result at this budget is a statement about the budget, not about",
      "the method, and must be reported that way."
    ]
  },

  "retention": {
    "per_task_cap": 1,
    "min_question_match_ratio": 0.0,
    "_comment": [
      "per_task_cap 1 keeps one passing trajectory per task so that easy tasks,",
      "which pass on every sample, cannot crowd out hard ones that pass once.",
      "min_question_match_ratio is 0.0, which turns the laundering filter's",
      "fourth rule off. Measured on dev over 757 correct expressions (D-071):",
      "the rule rejects genuine multi-step work because GSM8K writes many",
      "quantities as words. `three dozen eggs for her four children` contains no",
      "digits, so every literal in the correct `36 / 4` looks invented. At 0.25",
      "it rejected 16 correct expressions and caught nothing the first three",
      "rules had not already caught. Rules one to three stay on and rejected 5",
      "of 757.",
      "There is no row target. per_task_cap already bounds the set at one row",
      "per train task, and the retained count is whatever teacher coverage",
      "yields. Pinning a target before coverage is measured would pin a number",
      "the build may be unable to reach."
    ]
  },

  "selection": {
    "split": "dev",
    "rung": "R0",
    "metric": "pass^1",
    "checkpoints_evaluated": "all_saved",
    "_comment": [
      "Section 7.4's checkpoint selection rule, written before any dev number",
      "exists. The metric, the rung and the candidate set are literals here so",
      "that a tie or a disagreement between rungs cannot be resolved after the",
      "fact in whichever direction happens to look better.",
      "Every saved checkpoint is evaluated on dev. The dev winner is frozen and",
      "runs on test exactly once. Training loss never selects a checkpoint: it",
      "is computed on the training data and choosing by it is selection on the",
      "training set."
    ]
  },

  "format_grounding": {
    "dataset": "Salesforce/xlam-function-calling-60k",
    "fraction": 0.0,
    "_comment": [
      "Section 5.1 defers this to a measured format error rate, and section 5.1",
      "allows that the answer may be zero. It is (D-070).",
      "Measured on the dev split, 800 first decisions per model: the schema",
      "failure rate is 0.00% on both checkpoints. Every emitted call validated",
      "against the tool schema. Format grounding is what xlam is for, so mixing",
      "it in would spend data budget and CC BY attribution duty on a failure",
      "rate of zero.",
      "Measured on dev rather than test, because a checkpoint trained on a",
      "decision derived from test is no longer cleanly evaluated on test."
    ]
  }
}

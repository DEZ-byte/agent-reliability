name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reliability-kernel:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      # Pinned by commit, not tag: a tag can be moved to different code.
      # These are the commits v4 and v5 pointed to when they were pinned.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history. The artifact manifest records the commit that holds
          # each result file, and a shallow clone would resolve every file to
          # the single fetched commit and fail the check below.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --requirement requirements.lock
      - run: python -m pip install --no-deps --editable .
      - run: python -m compileall -q src tests scripts
      - name: Every frozen result matches its recorded hash and commit
        run: python scripts/build_artifact_manifest.py --check
      - name: Unit tests, with the network blocked
        run: python scripts/run_tests_offline.py -v

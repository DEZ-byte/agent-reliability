name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reliability-kernel:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      # Pinned by commit, not tag: a tag can be moved to different code.
      # These are the commits the v7 tags pointed to when they were pinned.
      # Both v7 releases run on Node 24.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history. The artifact manifest records the commit that holds
          # each result file, and a shallow clone would resolve every file to
          # the single fetched commit and fail the check below.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --requirement requirements.lock
      - run: python -m pip install --no-deps --editable .
      - run: python -m compileall -q src tests scripts
      - name: Every frozen result matches its recorded hash and commit
        run: python scripts/build_artifact_manifest.py --check
      - name: Unit tests, with the network blocked
        run: python scripts/run_tests_offline.py -v

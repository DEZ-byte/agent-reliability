[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-reliability"
version = "0.1.0"
description = "Fine-tuning a small model to call tools reliably, measured by executing every call"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic==2.13.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
